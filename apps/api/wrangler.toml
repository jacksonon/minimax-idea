name = "dreamreel-api"
main = "src/worker.ts"
compatibility_date = "2024-12-02"
compatibility_flags = ["nodejs_compat"]

# Build the Worker bundle from the local source. We exclude Node-only deps
# (better-sqlite3, tsx, @hono/node-server) at the bundle level — they are
# only used in the local dev path inside `src/index.ts` (guarded by
# import.meta.url === process.argv[1] at the bottom of the file).

# D1 database (dreams + users + sessions + rate_limits + share_tokens)
[[d1_databases]]
binding = "DB"
database_name = "dreamreel-db"
database_id = "6186c4a3-52c8-4ab0-bdea-b606b313eff3"

# R2 bucket for video and audio artifacts
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "dreamreel-media"

# KV namespace for share tokens and rate limits
[[kv_namespaces]]
binding = "KV"
id = "c625d5edc18d4cea80bb31f82b527079"

# Plain environment variables (non-secret)
[vars]
ENVIRONMENT = "production"
AI_PROVIDER = "gmi"
GMI_BASE_URL = "https://api.gmicloud.ai"
# H3_ENABLED is opt-in. When false, dreams render as 8-image slideshows.
# Set to "true" to enable H3 video generation (paid even during the contest).
H3_ENABLED = "false"
# CORS allowlist for the deployed web app. Replace with your Pages URL.
ALLOWED_ORIGIN = "https://dreamreel.pages.dev"

# Secrets — set these via `wrangler secret put <NAME>`. NEVER commit them.
#
#   wrangler secret put GMI_ENC_KEY     # AES-256-GCM key for at-rest
#                                        # encryption of user API keys
#                                        # (any length; SHA-256'd to 32 bytes)
#   wrangler secret put NEXTAUTH_SECRET
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
#   wrangler secret put GOOGLE_ID
#   wrangler secret put GOOGLE_SECRET
#
# IMPORTANT: do NOT set GMI_API_KEY. The service is a host only —
# every user must bring their own GMI API key (stored encrypted in
# D1). If GMI_API_KEY is set, the production API will still refuse
# to use it for user-initiated dream generation; the routes/dreams
# handler now requires a per-user key and 422s otherwise.

# Local dev environment (use `wrangler dev` to run with these vars).
[env.dev]
[env.dev.vars]
ENVIRONMENT = "development"
AI_PROVIDER = "mock"
H3_ENABLED = "true"
ALLOWED_ORIGIN = "http://localhost:3000"
