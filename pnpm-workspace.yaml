packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  workerd: set this to true or false

# pnpm 11+ requires explicit approval for native build scripts.
# This list governs which packages may run their `install` scripts.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - workerd
