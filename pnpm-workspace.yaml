packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11+ requires explicit approval for native build scripts.
# Set `onlyBuiltDependencies` (modern) and the legacy `allowBuilds` map.
# The legacy map is here as a fallback for pnpm 10; pnpm 11 reads onlyBuiltDependencies.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

allowBuilds:
  better-sqlite3: true
  esbuild: true
