name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.0.8
  NODE_VERSION: '22'

jobs:
  pages:
    name: Build & deploy web to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # Pages deploy only needs apps/web's deps + wrangler. Skip native
        # postinstall scripts to avoid pnpm 11's ERR_PNPM_IGNORED_BUILDS
        # hard error in CI (we don't need better-sqlite3, esbuild, or
        # workerd binaries for a static asset deploy).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build web
        env:
          # Pin the API URL so the bundle always points at the deployed
          # worker, regardless of any local env vars in the runner image.
          NEXT_PUBLIC_API_URL: https://dreamreel-api.right-ai.workers.dev
        run: pnpm --filter @dreamreel/web build

      - name: Deploy to Cloudflare Pages
        # Invoke wrangler from inside apps/web so the local node_modules/.bin
        # is on PATH. The GitHub-hosted runner sits on Cloudflare's
        # backbone so the direct-upload of apps/web/.next is fast, unlike
        # from a residential network where it can stall at 14/117 files.
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f8b9928e21de9330b1a461081bd4edf5
        run: pnpm exec wrangler pages deploy .next --project-name dreamreel-web --commit-dirty=true --branch main
